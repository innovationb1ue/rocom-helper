[project]
name = "roco-pvp-helper"
version = "0.1.0"
description = "Roco Kingdom PvP Helper - 属性克制分析、队伍构建、实时战斗追踪"
requires-python = ">=3.11"
dependencies = [
    "scapy>=2.5.0",
    "pycryptodome>=3.19",
    "fastapi>=0.109",
    "uvicorn>=0.27",
    "httpx>=0.26",
    "beautifulsoup4>=4.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
